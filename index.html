<style>@font-face{font-family:"Figtree";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/figtree-400.woff2") format("woff2")}@font-face{font-family:"Figtree";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/figtree-600.woff2") format("woff2")}@font-face{font-family:"Figtree";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/figtree-700.woff2") format("woff2")}@font-face{font-family:"Figtree";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/figtree-800.woff2") format("woff2")}@font-face{font-family:"Figtree";font-weight:900;font-style:normal;font-display:swap;src:url("fonts/figtree-900.woff2") format("woff2")}</style>
<title>Farkle Scorecard</title>

<style>
:root{
  /* Layout idea: a plain score sheet on white, matching the logo, with navy text and golden-orange accents. Names and running totals stay pinned at the top while rounds scroll; the bottom dock holds the number pad, the winner prompt, or a "score for next player" button. */
  --felt:#ffffff;
  --felt-2:#eef0fb;
  --felt-3:#dde1f7;
  --ivory:#ffffff;
  --ink:#14165a;
  --navy:#1d2181;
  --brass:#f6a821;
  --orange:#b86a00;
  --red:#c8402b;
  --text:#14165a;
  --muted:#5a5fa6;
  --line:rgba(29,33,129,.2);
  --display:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--felt);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body{min-height:100%;padding-top:env(safe-area-inset-top)}
#app::after{content:"";display:block;height:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#fff;z-index:60;pointer-events:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 12px 40px}
#app.padded{padding-bottom:420px}
#app.docked{padding-bottom:250px}
#app.kbd{padding-bottom:420px}


.logo{display:flex;justify-content:center;margin:8px 0 18px;background:#fff;position:relative}
.logo{align-items:center}
.homebot{display:flex;justify-content:center;margin:18px 0 6px}
.tools{display:flex;justify-content:center;align-items:flex-start;gap:0}
.tcol{display:flex;flex-direction:column;gap:10px;flex:1 1 0;min-width:0}
.tcol .btn{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding-left:12px;padding-right:12px;font-size:17px}
.tcol.tl{align-items:flex-end;padding-right:6px}.tcol.tr{align-items:flex-start;padding-left:6px}
.sheetlogo{margin-bottom:12px}
.homebtn{flex:0 0 auto;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:19px;color:var(--navy)}
.logo img{display:block;width:100%;height:auto;max-height:104px;object-fit:contain}
.head{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--felt);padding-bottom:8px;border-bottom:2px solid var(--line)}
.grid{display:grid;gap:6px;align-items:center}
.rn{font-size:14px;font-weight:700;color:var(--muted);text-align:center}

.name{width:100%;min-width:0;height:54px;padding:0 6px;border-radius:10px;border:2px solid var(--line);background:var(--felt-2);font-size:20px;font-weight:700;text-align:center}
.name::placeholder{color:var(--muted);font-weight:600;opacity:.9}
.name:focus{border-color:var(--navy);outline:none}
.name.up{border-color:var(--brass);box-shadow:0 0 0 3px rgba(246,168,33,.5)}

.tot{font-family:var(--display);font-size:34px;line-height:1.1;text-align:center;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;padding:6px 0 2px}
.tot.lead{color:var(--orange)}
.wins{font-size:15px;text-align:center;color:var(--muted);min-height:16px}

.cell{width:100%;min-width:0;height:58px;padding:0 4px;border-radius:10px;border:2px solid var(--line);background:var(--felt-2);font-size:26px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.cell.sel{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(29,33,129,.18)}
.cell.f{font-size:17px;font-weight:700;color:var(--red)}
.rows{display:flex;flex-direction:column;gap:6px;padding-top:10px}

.field{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding:10px 0;border-top:1px solid var(--line)}
.field label{font-weight:700}
.field small{display:block;font-weight:400;color:var(--muted);font-size:15px}
.field input{width:130px;height:54px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--felt-2);font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--navy);outline:none}
.tools{display:flex;flex-wrap:nowrap;gap:10px;margin-top:6px;justify-content:center}
.btn{min-height:54px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:700;font-size:18px}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.lead{border-color:var(--brass)}
.btn:disabled{opacity:.35;cursor:default}

.big{display:block;width:100%;min-height:70px;margin-top:22px;border:0;border-radius:16px;background:var(--brass);color:var(--ink);font-family:var(--display);font-size:24px;letter-spacing:.05em}
.big:active{background:var(--ivory)}
.big:disabled{opacity:.4}
.big span{display:block;font-size:24px;line-height:1.15}
.big small{display:block;margin-top:3px;font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:0}
.big.alt{background:#fff;border:3px solid var(--navy);color:var(--navy)}
.big.alt:active{background:var(--felt-3)}
.stackb{display:flex;flex-direction:column;gap:10px}
.stackb.pair{margin-top:22px}
.stackb .big{margin-top:0}
.welcome{margin:8px 0 14px;padding:16px;border-radius:18px;background:var(--felt-2);border:2px solid var(--line)}
.wtitle{margin:0;font-family:var(--display);font-size:26px}
.wtext{margin:4px 0 14px;font-size:17px;color:var(--muted)}
.link{background:none;border:0;padding:10px 0;color:var(--navy);font-weight:700;font-size:17px;text-decoration:underline}
.tools{margin-top:12px}
.ptitle{font-family:var(--display);font-size:26px;font-weight:400;margin:6px 0 4px}
.plabel{margin:18px 0 8px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:54px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--felt-2);font-weight:700;font-size:19px;display:inline-flex;align-items:center;gap:8px}
.chip small{font-weight:400;color:var(--muted);font-size:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.on small{color:#d7daf7}
.chip b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brass);color:var(--ink);font-size:13px}
.chip.grp{border-color:var(--brass)}
.chipwrap{display:inline-flex;align-items:center}
.forget{width:42px;height:54px;background:none;border:0;color:var(--muted);font-size:20px}
.addrow{display:flex;gap:8px;margin:16px 0}
.addrow input{flex:1;min-width:0;height:54px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--felt-2);font-size:20px;font-weight:600}
.addrow input:focus{border-color:var(--navy);outline:none}
.picker .btn{width:100%;margin-top:10px}
.picker .addrow .btn{width:auto;margin-top:0}
.ask{margin-top:20px;padding:14px;border-radius:14px;background:var(--felt-2);border:1px solid var(--line)}
.ask p{margin:0 0 10px;font-weight:700}
.ask .opts{display:flex;flex-wrap:wrap;gap:8px}
.note{margin:14px 0 0;font-size:15px;color:var(--muted)}

/* bottom dock: number pad, winner prompt, or score button */
.pad{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--felt-2);border-top:2px solid var(--line);box-shadow:0 -6px 18px rgba(20,22,90,.1);padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.home{margin-top:30px;padding:24px 16px}.home .wtitle{font-size:32px;text-align:center;margin:0 0 20px}.home .big{min-height:104px}.home .big span{font-size:30px}.home .stackb{gap:18px}
.chip.grp{width:100%;text-align:left;justify-content:flex-start}
.grpwrap{display:flex;width:100%}.grpwrap .chip.grp{flex:1}
.playto{margin:22px 0 0;text-align:center;font-size:17px;font-weight:700;color:var(--muted)}
.home .field,.picker .field{margin-top:20px}
[hidden]{display:none !important}
.settings{margin-top:24px;padding:14px 14px 4px;border-radius:18px;background:var(--felt-2);border:2px solid var(--line)}
.slabel{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prow .btn{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;font-size:18px;min-height:56px;background:#fff}
.settings .field{margin:14px 0 6px;padding-top:12px;border-top:2px solid var(--line)}
.settings .confirm{margin:12px 0 0}
.undorow{display:flex;justify-content:center;margin-top:14px}
.homebot{margin:12px 0 6px}
/* gold buttons share the logo's navy outline */
.big:not(.alt),.enter,.key.next,.kk.act,.two .key.gold,.declare{border:3px solid var(--navy) !important}
.key.next{border-width:2px !important}
@media (min-width:700px){
  .kk{height:64px;font-size:26px}.kk.num{height:70px}
  .key{min-height:68px}.pad-in{max-width:720px}
  #app.kbd{padding-bottom:470px}#app.padded{padding-bottom:470px}
  .cell{height:68px}.name{height:62px}
  .welcome,.picker{max-width:640px;margin-left:auto;margin-right:auto}
}
.kk,.key,.enter,.chip,.pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.name,#newname,#target{caret-color:transparent}
.key[data-k="neg"]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.key[data-k="neg"] .mk{display:block;width:24px;height:5px;border-radius:3px;background:currentColor;font-size:0;line-height:0}
.key[data-k="neg"] small{margin:0}
.pad .key.farkle{font-weight:900;letter-spacing:.06em}
#app[data-n="5"] .cell,#app[data-n="6"] .cell{padding:0 1px}
#app[data-n="5"] .name,#app[data-n="6"] .name{padding:0 2px}
#app[data-n="5"] .rn,#app[data-n="6"] .rn{font-size:11px}
@media (min-width:600px){#app .rn{font-size:15px !important}}
.tot,.cell{white-space:nowrap;overflow:hidden}
.key small{display:block;font-size:13px;font-weight:600;line-height:1;margin-top:2px}
.key .mk{font-size:30px;line-height:1}
.kb{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}
.kbr{display:flex;gap:5px;justify-content:center}
.kbr.ind{padding:0 4.5%}
.kk{flex:1 1 0;min-width:0;height:54px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:700;color:var(--ink);padding:0;font-family:inherit}
.kk:active{background:var(--navy);color:#fff}
.kk.wide{flex:1.5 1 0}.kk.space{flex:3.5 1 0;font-size:16px;color:var(--muted)}
.kk.on{background:var(--navy);color:#fff}
.kk.act{flex:2.6 1 0;background:var(--brass);border:0;font-size:19px;white-space:nowrap}
.kk.num{height:60px;font-size:28px}
@media (max-height:720px){.kk{height:46px}.kk.num{height:50px}#app.kbd{padding-bottom:360px}}
.tot,.wtitle,.ptitle,.big,.key.farkle{font-weight:800;letter-spacing:0}
.tot{font-weight:900}
.big span{font-weight:800}
.recap{margin:0 0 6px;text-align:center;font-size:22px;font-weight:800;color:var(--orange)}
.tally{margin:0 0 18px;text-align:center;font-size:19px;color:var(--muted);line-height:1.5}
.tally b{color:var(--ink)}
.sharelink{display:block;margin:-6px auto 6px;font-size:18px}
.sharebtn{width:100%;min-height:56px;font-size:19px;color:var(--navy);background:#fff;border:2px solid var(--navy)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--navy);color:#fff;font-weight:700;padding:14px 20px;border-radius:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.srows{margin-top:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff}
.srow{width:100%;font-family:inherit;text-align:left}button.srow:active{background:var(--ivory)}
.bigstat{text-align:center;font-size:20px;color:var(--navy);margin:6px 0 4px}.bigstat b{font-size:34px}.bigstat span{display:block;font-size:17px;color:#5a6390;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:10px}.bar{display:grid;grid-template-columns:84px 1fr 30px;gap:8px;align-items:center;font-size:15px;color:var(--navy)}.bl{font-weight:700}.bt{background:#fff;border:2px solid var(--line);border-radius:8px;height:22px;overflow:hidden}.bt i{display:block;height:100%;background:var(--navy);border-radius:5px}.bt i.bad{background:#c8402b}.bn{text-align:right;font-weight:800}
.chart{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 8px 8px;margin-top:10px}.chart svg{width:100%;height:auto;display:block}.legend{margin:6px 0 0;font-size:14px;color:#5a6390;text-align:center}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--navy);vertical-align:-2px}.legend .dw{background:#f6a821}.legend .dl{background:#fff}
.srow.top{border-color:var(--brass)}
.srow .sn{font-weight:800;font-size:20px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sw{font-size:16px;color:var(--navy);text-align:right}.srow .sw b{font-size:22px}
.srow .sm{grid-column:1/3;font-size:15px;color:#5a6390}
.minor{display:flex;flex-direction:column;gap:8px;margin-top:18px;align-items:center}
.confirm{margin-top:14px;padding:12px;border-radius:14px;background:#fff;border:2px solid var(--red);text-align:center}
.confirm p{margin:0 0 10px;font-weight:700}
.confirm .opts{display:flex;gap:10px;justify-content:center}
.pad[hidden]{display:none}
.pad-in{max-width:560px;margin:0 auto}
.pad-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;min-height:46px}
.pad-for{font-weight:700;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad-for span{color:var(--muted);font-weight:600}
.done{min-height:46px;padding:0 18px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:18px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{min-height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.key:active{background:var(--navy);color:#fff}
.key:disabled{opacity:.3}.key:disabled:active{background:#fff;color:inherit}
.key.end{color:var(--navy)}.key.end.hot{background:var(--brass);border:3px solid var(--navy);color:var(--ink)}
.hintx{color:#b86a00}
.cell.bad{color:#b86a00;border-color:#b86a00}
.key.farkle{grid-column:1 / -1;min-height:64px;background:var(--red);color:var(--ivory);font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.08em}
.key.farkle:active{background:#8f2c20;color:var(--ivory)}
.key.next{grid-column:4;grid-row:3 / span 2;background:var(--brass);color:var(--ink);font-size:22px;white-space:nowrap;padding:0 4px}
.key.next:active{background:var(--ivory)}
.key.bs{font-size:28px}
.enter{display:block;width:100%;min-height:66px;border:0;border-radius:14px;background:var(--brass);color:var(--ink);font-size:24px;font-weight:700}
.enter:active{background:var(--ivory)}
#cele{position:fixed;inset:0;z-index:50;background:rgba(20,22,90,.93);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
#cele .card{position:relative;z-index:2;background:#fff;border-radius:24px;padding:28px 18px 20px;width:100%;max-width:420px;text-align:center;border:4px solid var(--brass);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
#cele .trophy{font-size:64px;line-height:1}
#cele .who{font-family:var(--display);font-weight:900;font-size:44px;line-height:1.1;margin:10px 0 4px;color:var(--navy);word-break:break-word}
#cele .wins-t{font-size:26px;font-weight:700;margin:0 0 6px;color:var(--orange)}
#cele .sc{font-size:20px;color:var(--muted);margin:0 0 6px}
#cele .sub{font-size:17px;color:var(--muted);margin:0 0 16px}
#cele .big{width:100%;margin-top:12px}
.cf{position:absolute;top:-24px;width:12px;height:18px;opacity:.95;animation:fall linear infinite;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cf{display:none}#cele .card{animation:none}}
.declare{margin-top:10px;width:100%;min-height:56px;font-size:22px;font-weight:700;border-radius:14px;border:3px solid var(--brass);background:#fff;color:var(--navy)}
.win-msg{margin:0 0 4px;font-size:22px}
.win-sub{margin:0 0 10px;font-size:16px;color:var(--muted)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.two .key{font-size:22px;min-height:64px}
.two .key.gold{background:var(--brass);color:var(--ink)}

.key.farkle,.key.next,.two .key.gold{border:0}
.sugl{margin:0 0 8px;font-size:15px;color:var(--muted)}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
@media (max-height:720px){
  .key{min-height:50px;font-size:26px}
  .key.farkle{min-height:56px;font-size:24px}
  .pad{padding-top:6px}
  .pad-top{min-height:42px;margin-bottom:6px}
  .done{min-height:42px}
  .keys{gap:6px}
  #app.padded{padding-bottom:360px}
}
@media (prefers-reduced-motion:no-preference){
  .cell,.name{transition:border-color .12s ease,background-color .12s ease}
}
</style>

<body>

<script>
(function(){
'use strict';
var KEY = 'farkle-sheet-v1';
function sortedRoster(){ return S.roster.slice().sort(function(a,b){ var x=a.toLowerCase(), y=b.toLowerCase(); return x<y?-1:x>y?1:0; }); }
function maxP(){ var w = Math.min(window.innerWidth || 390, 1000); return Math.max(2, Math.min(10, Math.floor((w - 26) / 54))); }
var S = {names:['',''], rows:[['','']], wins:{}, target:10000, dismissed:false, prev:null,
         ask:false, ok:true, sel:null, fresh:false, typing:false, focusName:null, mute:0, welcome:false, home:false, kbT:0, homeNav:false, confirmRemove:false, moreGroups:false, last:null, confirmClear:false, updated:0, editRoster:false,
         roster:[], groups:[], picking:false, pickSel:[], hist:[], stats:false, statP:null, nameOrig:null, pre:null, neg:false, last:''};

function idbOpen(cb){
  try{
    var r = indexedDB.open('farkle', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onsuccess = function(){ cb(r.result); };
    r.onerror = function(){ cb(null); };
  }catch(e){ cb(null); }
}
function idbPut(val){ idbOpen(function(db){ if(!db) return; try{ db.transaction('kv', 'readwrite').objectStore('kv').put(val, 'state'); }catch(e){} }); }
function idbGet(cb){
  idbOpen(function(db){
    if(!db) return cb(null);
    try{ var q = db.transaction('kv', 'readonly').objectStore('kv').get('state'); q.onsuccess = function(){ cb(q.result || null); }; q.onerror = function(){ cb(null); }; }

function render(){
  document.getElementById('app').style.maxWidth = (S.picking || (S.home && !S.welcome)) ? '640px' : '';
  var t = totals(), max = Math.max.apply(null, t), li = leaderIdx(t), u = nextUp();
  if(S.picking){
    document.getElementById('app').innerHTML = barHtml() + '<div class="picker">' + pickerHtml() + '</div>';
    renderDock();
    return;
  }
  if(S.home && !S.welcome){
    document.getElementById('app').innerHTML = barHtml() + (S.stats ? (S.statP ? playerStatsHtml(S.statP) : statsHtml()) : homeHtml());
    renderDock();
    return;
  }
  var h = barHtml() + (S.welcome ? welcomeHtml() : '') + '<div class="head">';
  h += '<div class="grid" style="' + cols() + '"><span class="rn"></span>';
  S.names.forEach(function(n,c){
    h += '<input class="name' + (c === u.c ? ' up' : '') + '" data-name="' + c + '" value="' + esc(n) + '" placeholder="Player ' + (c+1) + '" maxlength="14" autocomplete="off" autocapitalize="words" readonly inputmode="none" enterkeyhint="done" aria-label="Player ' + (c+1) + ' name">';
  });
  h += '</div><div class="grid" style="' + cols() + '"><span class="rn">Total</span>';
  t.forEach(function(v,c){ h += '<div class="tot' + (v === max && v > 0 ? ' lead' : '') + '" id="tot-' + c + '">' + fmt(v) + '</div>'; });
  h += '</div><div class="grid" style="' + cols() + '"><span class="rn">Wins</span>';
  S.names.forEach(function(n,c){ h += '<div class="wins">' + (S.wins[wkey(c)] || 0) + '</div>'; });
  h += '</div></div><div class="rows" id="rows">' + rowsHtml() + '</div>';
  if(S.ask){
    h += '<div class="ask" role="group" aria-label="Who won?"><p>Who won?</p><div class="opts">';
    S.names.forEach(function(n,c){ h += '<button class="btn' + (c === li && max > 0 ? ' lead' : '') + '" data-act="winner" data-c="' + c + '">' + esc(label(c)) + '</button>'; });
    h += '<button class="btn" data-act="nowin">No winner</button><button class="btn" data-act="cancel">Cancel</button></div></div>';
  }
  h += '<p class="playto">' + (S.target > 0 ? 'First to ' + fmt(S.target) + ' wins' : 'No winning score set') + '</p>';
  if(S.prev) h += '<div class="undorow"><button class="link" data-act="undoNew">Undo new game</button></div>';
  if(!S.home) h += '<div class="homebot"><button class="homebtn" data-act="gohome">\u2039 Home</button></div>';
  if(!S.ok) h += '<p class="note">This browser is not saving. Scores will be lost if the page closes.</p>';
  document.getElementById('app').innerHTML = h;
  fitAll();
  renderDock();
  if(S.focusName !== null){
    var fi = document.querySelector('.name[data-name="' + S.focusName + '"]');
    S.focusName = null;
    if(fi){ fi.focus(); try{ fi.scrollIntoView({block:'nearest'}); }catch(e){} }
  }
  if(S.ask){
    var ak = document.querySelector('.ask');
    if(ak){ try{ ak.scrollIntoView({block:'center'}); }catch(e){} }
  }
}

function reveal(){
  var el = document.querySelector('.cell.sel');
  if(!el) return;
  try{
    var head = document.querySelector('.head'), pad = document.getElementById('pad');
    var topEdge = head ? head.offsetHeight : 0;  /* the header will be stuck to the top once we scroll */
    var botEdge = (pad && !pad.hidden) ? pad.getBoundingClientRect().top : window.innerHeight;
    var r = el.getBoundingClientRect();
    var want = topEdge + (botEdge - topEdge - r.height) / 2;
    window.scrollBy(0, r.top - want);
  }catch(e){}
}

function select(r, c){
  cancelEdit();
  S.kbT = 0;
  var ae = document.activeElement;
  if(ae && ae.tagName === 'INPUT'){ S.typing = false; ae.blur(); }
  S.typing = false;
  S.sel = {r:r, c:c};
  S.fresh = true;
  renderRows();
  renderDock();
  reveal();
}

function advance(){
  var s = S.sel;
  if(!s) return;
  if(bannerOn()){ S.sel = null; renderRows(); renderDock(); showCele(); return; }
  var r = s.r, c = s.c + 1;
  if(c >= S.names.length){ c = 0; r++; }
  if(r >= S.rows.length) S.rows.push(blankRow());
  select(r, c);
}

function setCell(v){
  var s = S.sel;
  S.rows[s.r][s.c] = v;
  ensureTrailingRow();
  save();
  renderRows();
  renderDock();
}

function snapshotPrev(){ S.prev = {rows:S.rows, wins:JSON.parse(JSON.stringify(S.wins)), names:S.names.slice(), hl:S.hist.length}; }

function showCele(){
  var t = totals(), li = leaderIdx(t);
  if(li < 0 || document.getElementById('cele')) return;
  S.sel = null; renderRows(); renderDock();
  S.mute = Date.now() + 600;
  var cols = ['#f6a821','#1d2181','#2f6fe0','#b86a00','#ffd36b','#c8402b'], conf = '';
  for(var i=0;i<60;i++){
    conf += '<i class="cf" style="left:' + Math.round(Math.random()*100) + '%;background:' + cols[i % cols.length] + ';animation-duration:' + (2.4 + Math.random()*2.6).toFixed(2) + 's;animation-delay:-' + (Math.random()*4).toFixed(2) + 's;transform:rotate(' + Math.round(Math.random()*360) + 'deg)"></i>';
  }
  var n = (S.wins[wkey(li)] || 0) + 1;
  var el = document.createElement('div');
  el.id = 'cele'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Winner');
  el.innerHTML = conf + '<div class="card"><div class="trophy">\ud83c\udfc6</div><p class="wins-t">Winner!</p><div class="who">' + esc(label(li)) + '</div>' +
    '<p class="sc">' + fmt(t[li]) + ' points</p>' +
    '<p class="sub">Passed ' + fmt(S.target) + '. Some play one last round. Tap Keep rolling if others get a turn.</p>' +
    '<button class="big" data-act="celefinish"><span>' + esc(label(li)) + ' wins!</span><small>win number ' + n + ' \u00b7 start next game</small></button>' +
    '<button class="big alt" data-act="celekeep"><span>Keep rolling</span><small>others get a last turn</small></button></div>';
  document.body.appendChild(el);
}
function hideCele(){ var el = document.getElementById('cele'); if(el) el.remove(); S.mute = Date.now() + 500; }
function finishGame(winner){
  snapshotPrev();
  if(winner !== null){
    S.hist.push({n:S.names.map(function(n,i){ return label(i); }), s:totals(), w:label(winner), d:Date.now(), t:S.names.map(function(n,c){ var o = []; S.rows.forEach(function(r){ var v = String(r[c]).trim(); if(v === 'F') o.push('F'); else if(v !== '' && !isNaN(parseInt(v, 10))) o.push(parseInt(v, 10)); }); return o; })});
    if(S.hist.length > 500) S.hist.shift();
    // give unnamed players their default name first so wins stay with the right person after reordering
    S.names = S.names.map(function(n,i){ return n.trim() || 'Player ' + (i+1); });
    var k = wkey(winner); S.wins[k] = (S.wins[k] || 0) + 1;
    S.names = S.names.slice(winner).concat(S.names.slice(0, winner));
  }
  rememberNames();
  recordGroup(S.names);
  S.rows = [blankRow()];
  S.ask = false;
  S.sel = null;
  S.dismissed = false;
  S.home = true; S.homeNav = false;
  S.last = winner !== null ? S.names[0] : '';
  S.confirmClear = false;
  save();
  render();
  syncNav();
  window.scrollTo(0, 0);
}

function startWith(names){
  S.kbT = 0;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  snapshotPrev();
  S.names = names.slice(0, maxP());
  rememberNames();
  recordGroup(S.names);
  S.rows = [blankRow()];
  S.ask = false;
  S.sel = null;
  S.dismissed = false;
  S.picking = false;
  S.home = false; S.homeNav = false;
  save();
  render();
  syncNav();
  window.scrollTo(0, 0);
}

function addName(){
  S.kbT = 0;
  var el = document.getElementById('newname');
  var t = el ? el.value.trim() : '';
  if(el && el.blur) el.blur();
  if(!t) return;
  var idx = inListCI(S.roster, t);
  if(idx < 0){ S.roster.push(t); idx = S.roster.length - 1; }
  var name = S.roster[idx];
  if(inListCI(S.pickSel, name) < 0 && S.pickSel.length < maxP()) S.pickSel.push(name);
  save();
  render();
}

function pickerHtml(){
  var sel = S.pickSel;
  var first = !hasRealNames() && S.home;
  var h = '<h1 class="ptitle">' + (first ? 'Who is playing?' : 'Who is playing?') + '</h1>';
  if(S.groups.length){
    h += '<p class="plabel">Played together before. Tap to start.</p><div class="chips">';
    var shown = (S.moreGroups || S.editRoster) ? S.groups.length : Math.min(3, S.groups.length);
    S.groups.slice(0, shown).forEach(function(g,i){
      var b1 = '<button class="chip grp" data-act="startGroup" data-i="' + i + '">' + esc(g.join(' \u00b7 ')) + '</button>';
      h += S.editRoster ? '<span class="chipwrap grpwrap">' + b1 + '<button class="forget" data-act="forgetgrp" data-i="' + i + '" aria-label="Remove this group">\u00d7</button></span>' : b1;
    });
    h += '</div>';
    if(!S.editRoster && S.groups.length > 3) h += '<button class="link" data-act="moreGroups">' + (S.moreGroups ? 'Show fewer groups' : 'Show ' + (S.groups.length - 3) + ' more group' + (S.groups.length - 3 === 1 ? '' : 's')) + '</button>';
  }
  h += '<p class="plabel">Or tap each name in playing order</p><div class="chips">';
  sortedRoster().forEach(function(n){
    var i = inListCI(sel, n);
    h += '<span class="chipwrap"><button class="chip' + (i > -1 ? ' on' : '') + '" data-act="pickToggle" data-name="' + esc(n) + '" aria-pressed="' + (i > -1) + '">' + (i > -1 ? '<b>' + (i+1) + '</b>' : '') + esc(n) + ' <small>' + (S.wins[n.trim().toLowerCase()] || 0) + ((S.wins[n.trim().toLowerCase()] || 0) === 1 ? ' win' : ' wins') + '</small></button>';
    if(S.editRoster) h += '<button class="forget" data-act="forget" data-name="' + esc(n) + '" aria-label="Remove ' + esc(n) + ' from saved names">\u00d7</button>';
    h += '</span>';
  });
  if(!S.roster.length) h += '<p class="muted">No saved names yet. Type a name below and tap Add.</p>';
  h += '</div>';
  if(S.roster.length) h += '<button class="link" data-act="toggleEdit">' + (S.editRoster ? 'Finished removing' : 'Remove a saved name') + '</button>';
  h += '<p class="plabel">New name</p><div class="addrow"><input id="newname" readonly inputmode="none" maxlength="14" placeholder="Type a name" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-label="New player name"><button class="btn" data-act="addName">Add</button></div>';
  h += targetField();
  if(sel.length >= maxP()) h += '<p class="note" style="text-align:center">This screen fits up to ' + maxP() + ' players. A bigger screen, or turning it sideways, fits more.</p>';
  h += '<button class="big" data-act="startPick"' + (sel.length ? '' : ' disabled') + '>Start with ' + sel.length + ' player' + (sel.length === 1 ? '' : 's') + '</button>';
  if(!first) h += '<button class="btn" data-act="pickCancel">Cancel</button>';
  if(!S.home) h += '<p class="note">Starting clears the current scores. "Undo new game" brings them back.</p>';
  return h;
}

function press(k){
  if(k === 'enter'){ var u = nextUp(); select(u.r, u.c); return; }
  if(k === 'declare'){ finishGame(leaderIdx(totals())); return; }
  if(k === 'celebrate'){ showCele(); return; }
  if(k === 'keep'){ S.dismissed = true; save(); renderDock(); return; }
  var s = S.sel;
  if(!s) return;
  var cur = String(S.rows[s.r][s.c]);
  if(k === 'done'){ cancelEdit(); S.sel = null; renderRows(); renderDock(); if(bannerOn()) showCele(); return; }
  if(k === 'next'){ if(!editOk()) return; S.pre = null; S.neg = false; advance(); return; }
  if(k === 'farkle'){ S.pre = null; S.neg = false; setCell('F'); advance(); return; }
  if(k === 'bs'){
    S.fresh = false;
    if(S.pre === null){
      if(cur === 'F' || cur === ''){ setCell(''); return; }
      S.neg = cur.charAt(0) === '-'; S.pre = cur.replace('-', ''); S.last = cur;
    }
    if(S.pre !== '') S.pre = S.pre.slice(0, -1);
    else if(S.neg) S.neg = false;
    commitEdit(); return;
  }
  if(k === 'neg'){
    S.fresh = false;
    if(S.pre === null){
      if(cur === 'F' || cur === ''){ S.pre = ''; S.last = cur; S.neg = true; commitEdit(); return; }
      S.neg = cur.charAt(0) !== '-'; S.pre = cur.replace('-', ''); S.last = cur; commitEdit(); return;
    }
    S.neg = !S.neg; commitEdit(); return;
  }
  var add = k === '00' ? '00' : k === '50' ? '50' : /^\d$/.test(k) ? k : null;
  if(add === null) return;
  if(S.pre === null){ S.last = cur; S.pre = ''; S.neg = false; }
  S.fresh = false;
  var np = (S.pre + add).replace(/^0+(?=\d)/, '');
  if(np.length > 7) return;
  S.pre = np;
  commitEdit();
}
function editVal(){
  if(S.pre === null || S.pre === '') return null;
  var v = parseInt(S.pre, 10) * (S.neg ? -1 : 1);
  return (isNaN(v) || v === 0 || v % 50 !== 0) ? null : v;
}
function editOk(){ return S.pre === null || editVal() !== null; }
function commitEdit(){
  var v = editVal();
  if(S.pre === '' && !S.neg){ S.pre = ''; }
  setCell(v === null ? '' : String(v));
}
function cancelEdit(){
  if(S.pre !== null && S.sel && editVal() === null){ S.rows[S.sel.r][S.sel.c] = S.last || ''; save(); }
  S.pre = null; S.neg = false;
}

document.addEventListener('focusin', function(e){
  var t = e.target;
  if(t.tagName === 'INPUT'){
    if(t.dataset && t.dataset.name !== undefined && !S.nameOrig){ S.nameOrig = {i:Number(t.dataset.name), v:String(S.names[Number(t.dataset.name)] || '').trim()}; }
    S.typing = true;
    if(S.sel){ S.sel = null; renderRows(); }
    renderDock();
    if(t.id === 'newname' || t.id === 'target'){
      setTimeout(function(){
        try{
          var pd = document.getElementById('pad'), r = t.getBoundingClientRect(), top = pd.getBoundingClientRect().top;
          if(r.bottom > top - 12) window.scrollBy(0, r.bottom - top + 70);
        }catch(err){}
      }, 40);
    }
  }
});
function finishTyping(){
  S.kbT = 0;
  var a = document.activeElement;
  if(S.picking && a && a.id === 'newname'){ addName(); }
  else if(a && a.blur){ a.blur(); }
}
document.addEventListener('keydown', function(e){
  var tt = e.target;
  if(tt.tagName === 'INPUT' && tt.readOnly && !e.ctrlKey && !e.metaKey && !e.altKey){
    if(e.key === 'Backspace'){ e.preventDefault(); kbApply(tt, 'kbs'); return; }
    if(e.key === ' '){ e.preventDefault(); kbApply(tt, 'ksp'); return; }
    if(e.key.length === 1){ e.preventDefault(); kbApply(tt, 'kc', e.key); return; }
  }
  if(e.key === 'Enter' && e.target.tagName === 'INPUT'){
    e.preventDefault();
    if(e.target.id === 'newname') addName(); else e.target.blur();
  }
});
document.addEventListener('pointerdown', function(e){
  var t = e.target;
  var kkb = t.closest && t.closest(KBSEL);
  if(kkb){ e.preventDefault(); S.kbT = Date.now(); S.mute = Date.now() + 400; kbPress(kkb); return; }
  if(t.closest && t.closest('[data-k="typingdone"]')){ e.preventDefault(); S.mute = Date.now() + 500; S.kbT = 0; finishTyping(); return; }
  var fnb = t.closest && t.closest('[data-k="fillname"]');
  if(fnb){
    e.preventDefault(); S.kbT = 0;
    S.mute = Date.now() + 500;
    var fa = document.activeElement;
    if(fa && fa.dataset && fa.dataset.name !== undefined){
      fa.value = fnb.dataset.name;
      S.names[Number(fa.dataset.name)] = fnb.dataset.name;
      rememberNames(); save();
      fa.blur();
      renderRows();
      var lb2 = document.querySelectorAll('.wins');
      S.names.forEach(function(n,c){ if(lb2[c]) lb2[c].textContent = S.wins[wkey(c)] || 0; });
    }
    return;
  }
  var a = document.activeElement;
  if(a && a.tagName === 'INPUT' && !(t.closest && t.closest('input'))){ S.kbT = 0; a.blur(); }
});
function onPad(t){ return !!(t && t.closest && t.closest('#pad')); }
document.addEventListener('mousedown', function(e){ if(onPad(e.target) && S.typing) e.preventDefault(); }, true);
document.addEventListener('touchstart', function(e){ if(onPad(e.target) && S.typing && e.cancelable) e.preventDefault(); }, {capture:true, passive:false});
document.addEventListener('focusout', function(e){
  var fe = e.target;
  /* if a key tap on our keyboard made the field lose focus, put the focus straight back */
  if(fe.tagName === 'INPUT' && S.kbT && Date.now() - S.kbT < 1200 && !S.kbLeave){
    S.kbT = Date.now();
    setTimeout(function(){ try{ fe.focus({preventScroll:true}); }catch(err){} }, 0);
    return;
  }
  if(e.target.dataset && e.target.dataset.name !== undefined){ carryRename(Number(e.target.dataset.name)); rememberNames(); save(); updateTotals(); var wl = document.querySelectorAll('.wins'); S.names.forEach(function(n,c){ if(wl[c]) wl[c].textContent = (S.wins[wkey(c)] || 0); }); }
  if(e.target.tagName === 'INPUT'){
    S.typing = false;
    renderDock();
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.dataset && t.dataset.name !== undefined){
    S.names[Number(t.dataset.name)] = t.value;
    save();
    fitAll();
    var lb = document.querySelectorAll('.wins');
    S.names.forEach(function(n,c){ if(lb[c]) lb[c].textContent = S.wins[wkey(c)] || 0; });
    renderDock();
  } else if(t.id === 'target'){
    var v = parseInt(t.value, 10);
    S.target = isNaN(v) || v < 0 ? 0 : v;
    S.dismissed = false;
    save();
    renderDock();
  }
});

var nav = {depth:0, skip:0};
function wantDepth(){ return (S.picking ? 1 : 0) + (S.ask ? 1 : 0) + ((S.home && S.homeNav) ? 1 : 0) + (S.stats ? 1 : 0) + (S.statP ? 1 : 0); }
function syncNav(){
  try{
    var want = wantDepth();
    while(nav.depth < want){ history.pushState({fk:1}, ''); nav.depth++; }
    if(nav.depth > want){ var n = nav.depth - want; nav.depth = want; nav.skip++; history.go(-n); }
  }catch(err){}
}
window.addEventListener('popstate', function(){
  if(nav.skip > 0){ nav.skip--; return; }
  if(nav.depth > 0) nav.depth--;
  if(S.statP){ S.statP = null; }
  else if(S.stats){ S.stats = false; }
  else if(S.ask){ S.ask = false; }
  else if(S.picking){ S.picking = false; }
  else if(S.home && S.homeNav){ S.home = false; S.homeNav = false; S.welcome = false; }
  save(); render();
});
document.addEventListener('click', function(e){
  if(Date.now() < S.mute){ e.preventDefault(); return; }
  var cell = e.target.closest('.cell');
  if(cell){ select(Number(cell.dataset.r), Number(cell.dataset.c)); return; }
  var kb2 = e.target.closest(KBSEL);
  if(kb2){ if(S.kbT && Date.now() - S.kbT < 2500){ S.kbT = 0; return; } kbPress(kb2); return; }
  var key = e.target.closest('[data-k]');
  if(key && key.dataset.k === 'typingdone'){ finishTyping(); return; }
  if(key){ press(key.dataset.k); return; }
  var b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  var a = b.dataset.act;
  if(a !== 'remp') S.confirmRemove = false;
  if(a === 'addp' && S.names.length < maxP()){
    S.names.push(''); S.rows.forEach(function(r){ r.push(''); });
    S.focusName = S.names.length - 1;
  } else if(a === 'remp' && S.names.length > 1){
    var lastC = S.names.length - 1;
    if(S.rows.some(function(r){ return String(r[lastC]).trim() !== ''; })){ S.confirmRemove = true; render(); return; }
    S.names.pop(); S.rows.forEach(function(r){ r.pop(); });
    if(S.sel && S.sel.c >= S.names.length) S.sel = null;
  } else if(a === 'remyes' && S.names.length > 1){
    S.names.pop(); S.rows.forEach(function(r){ r.pop(); }); S.confirmRemove = false;
    if(S.sel && S.sel.c >= S.names.length) S.sel = null;
  } else if(a === 'remno'){
    S.confirmRemove = false;
  } else if(a === 'shareGame'){
    shareText(lastGameText()); return;
  } else if(a === 'shareStats'){
    shareText(standingsText()); return;
  } else if(a === 'statp'){
    S.statP = b.dataset.p; render(); syncNav(); window.scrollTo(0, 0); return;
  } else if(a === 'stats'){
    S.stats = true; S.statP = null; render(); syncNav(); window.scrollTo(0, 0); return;
  } else if(a === 'statsback'){
    if(S.statP) S.statP = null; else S.stats = false; render(); syncNav(); window.scrollTo(0, 0); return;
  } else if(a === 'gohome'){
    S.stats = false; S.statP = null;
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    S.kbT = 0; S.home = true; S.homeNav = true; S.sel = null; S.ask = false; S.welcome = false; S.picking = false; S.confirmClear = false;
  } else if(a === 'wkeep'){
    S.welcome = false; S.home = false; S.homeNav = false;
  } else if(a === 'moreGroups'){
    S.moreGroups = !S.moreGroups;
  } else if(a === 'forgetgrp'){
    S.groups.splice(Number(b.dataset.i), 1);
  } else if(a === 'toggleEdit'){
    S.editRoster = !S.editRoster;
  } else if(a === 'newgame'){
    S.ask = true; S.sel = null; S.welcome = false; S.home = false; S.homeNav = false;
  } else if(a === 'cancel'){
    S.ask = false;
  } else if(a === 'picker'){
    rememberNames();
    S.pickSel = [];
    S.editRoster = false;
    S.picking = true; S.sel = null; S.ask = false; S.welcome = false;
  } else if(a === 'celefinish'){
    var li2 = leaderIdx(totals()); hideCele(); finishGame(li2);
  } else if(a === 'celekeep'){
    hideCele(); S.dismissed = true; save(); renderDock();
  } else if(a === 'clearask'){
    S.confirmClear = true; render(); return;
  } else if(a === 'clearno'){
    S.confirmClear = false; render(); return;
  } else if(a === 'clearyes'){
    S.wins = {}; S.hist = []; S.confirmClear = false;
  } else if(a === 'playagain'){
    S.home = false; S.homeNav = false; S.stats = false; S.statP = null; S.sel = null; render(); syncNav(); return;
  } else if(a === 'pickCancel'){
    S.picking = false;
  } else if(a === 'pickToggle'){
    var pi = inListCI(S.pickSel, b.dataset.name);
    if(pi > -1) S.pickSel.splice(pi, 1); else if(S.pickSel.length < maxP()) S.pickSel.push(b.dataset.name);
  } else if(a === 'forget'){
    var ri = inListCI(S.roster, b.dataset.name);
    if(ri > -1) S.roster.splice(ri, 1);
    var si = inListCI(S.pickSel, b.dataset.name);
    if(si > -1) S.pickSel.splice(si, 1);
  } else if(a === 'addName'){
    addName(); return;
  } else if(a === 'startPick'){
    if(S.pickSel.length) startWith(S.pickSel.slice());
    return;
  } else if(a === 'startGroup'){
    var g = S.groups[Number(b.dataset.i)];
    if(g) startWith(g.slice());
    return;
  } else if(a === 'winner'){
    finishGame(Number(b.dataset.c)); return;
  } else if(a === 'nowin'){
    finishGame(null); return;
  } else if(a === 'undoNew'){
    if(S.prev){
      var pn = Array.isArray(S.prev.names) && S.prev.names.length ? S.prev.names : S.names;
      if(S.prev.rows[0] && S.prev.rows[0].length === pn.length){
        S.names = pn; S.rows = S.prev.rows; S.wins = S.prev.wins; S.dismissed = true;
        if(typeof S.prev.hl === 'number') S.hist = S.hist.slice(0, S.prev.hl);
      }
    }
    S.prev = null; S.home = true; S.homeNav = true; S.stats = false; S.statP = null; S.last = null; S.ask = false; S.sel = null;
  }
  save();
  render();
  syncNav();
});

load();
render();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
/* second copy of the scores: if the phone ever empties the first one, bring it back */
if(!localStorage.getItem(KEY)){
  idbGet(function(v){
    if(!v || localStorage.getItem(KEY) || S.updated) return;
    try{ localStorage.setItem(KEY, v); }catch(e){ return; }
    S.picking = false; S.home = false; S.welcome = false;
    load(); render(); syncNav();
  });
}
})();
</script>
